<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Formulário</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;}
  #overlay{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:10;
    color:#fff;font-family:Arial, sans-serif;text-align:center;padding:20px;
  }
  #icon{width:120px;height:120px;margin-bottom:30px;}
  #cta{font-size:8vw;font-weight:normal;margin:0;}
  #sub{font-size:5vw;margin-top:15px;color:#aaa;}
  #btn{
    margin-top:40px;
    font-size:6vw;
    font-weight:bold;
    color:#fff;
    background:#7248B9;
    border:none;
    border-radius:50px;
    padding:5vw 12vw;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  #btn:active{transform:scale(.96);}
</style>
</head>
<body>
<div id="overlay">
  <svg id="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path fill="#7248B9" d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/>
    <path fill="#7248B9" d="M14 2l6 6h-6V2z" opacity=".5"/>
    <rect x="8" y="12" width="1.6" height="1.6" fill="#fff"/>
    <rect x="8" y="15.2" width="1.6" height="1.6" fill="#fff"/>
    <rect x="8" y="18.4" width="1.6" height="1.6" fill="#fff"/>
    <rect x="10.8" y="12" width="5.2" height="1.6" fill="#fff"/>
    <rect x="10.8" y="15.2" width="5.2" height="1.6" fill="#fff"/>
    <rect x="10.8" y="18.4" width="5.2" height="1.6" fill="#fff"/>
  </svg>
  <p id="cta">Clique aqui para votar</p>
  <p id="sub">Formulário de votação</p>
  <!-- Botão real: o clique dele é o gesto que desbloqueia e dispara a sirene -->
  <button id="btn">🔊 Permitir som e votar</button>
</div>

<script>
let ctx, running = false;

// O evento 'click' de um botão real é o gesto mais confiável
// para desbloquear áudio em iOS e Android.
document.getElementById('btn').addEventListener('click', start);

// Reforço: toques em qualquer lugar da tela também funcionam
// (caso a pessoa toque fora do botão).
['pointerdown','touchstart'].forEach(ev =>
  document.addEventListener(ev, start, { once: false })
);

function start(){
  if (running) return;
  try {
    // Cria o AudioContext DENTRO do gesto de toque
    ctx = new (window.AudioContext || window.webkitAudioContext)();

    // Desbloqueio do iOS: buffer silencioso tocado sincronamente no gesto
    const silent = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = silent;
    src.connect(ctx.destination);
    src.start(0);

    ctx.resume().then(() => {
      if (ctx.state !== 'running') return; // ainda bloqueado? espera o próximo toque
      running = true;
      startSiren();
    }).catch(()=>{});
  } catch(e){}
}

function startSiren(){
  const osc1 = ctx.createOscillator();
  const osc2 = ctx.createOscillator();
  osc1.type = 'sawtooth';
  osc2.type = 'square';
  osc1.frequency.value = 700;
  osc2.frequency.value = 900;

  const gain = ctx.createGain();
  gain.gain.value = 1.0;

  const lfo = ctx.createOscillator();
  lfo.frequency.value = 3;
  const lfoGain = ctx.createGain();
  lfoGain.gain.value = 250;
  lfo.connect(lfoGain);
  lfoGain.connect(osc1.frequency);
  lfoGain.connect(osc2.frequency);

  osc1.connect(gain);
  osc2.connect(gain);
  gain.connect(ctx.destination);

  osc1.start();
  osc2.start();
  lfo.start();

  // Vibração contínua (Android)
  if (navigator.vibrate) {
    setInterval(() => navigator.vibrate([500, 200]), 700);
  }

  // Mantém a tela ligada quando possível
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').catch(()=>{});
  }

  // Reforço: se o sistema suspender o áudio, religa
  setInterval(() => { if (ctx && ctx.state === 'suspended') ctx.resume(); }, 1000);
}
</script>
</body>
</html>
