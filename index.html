<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Formulário</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;}
  #overlay{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:10;
    color:#fff;font-family:Arial, sans-serif;text-align:center;padding:20px;
  }
  #icon{width:120px;height:120px;margin-bottom:30px;}
  #cta{font-size:8vw;font-weight:normal;margin:0;}
  #sub{font-size:5vw;margin-top:15px;color:#aaa;}
</style>
</head>
<body>
<div id="overlay">
  <!-- Ícone do Google Forms (SVG inline) -->
  <svg id="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path fill="#7248B9" d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/>
    <path fill="#7248B9" d="M14 2l6 6h-6V2z" opacity=".5"/>
    <rect x="8" y="12" width="1.6" height="1.6" fill="#fff"/>
    <rect x="8" y="15.2" width="1.6" height="1.6" fill="#fff"/>
    <rect x="8" y="18.4" width="1.6" height="1.6" fill="#fff"/>
    <rect x="10.8" y="12" width="5.2" height="1.6" fill="#fff"/>
    <rect x="10.8" y="15.2" width="5.2" height="1.6" fill="#fff"/>
    <rect x="10.8" y="18.4" width="5.2" height="1.6" fill="#fff"/>
  </svg>
  <p id="cta">Clique aqui para votar</p>
  <p id="sub">Formulário de votação</p>
</div>

<script>
let ctx, osc1, osc2, gain, lfo, lfoGain, running = false;

// Tenta iniciar automaticamente (será bloqueado se não houver interação)
window.addEventListener('load', () => { start(); });

// Qualquer toque/click/tecla dispara o alarme
['pointerdown','touchstart','keydown','click'].forEach(ev =>
  document.addEventListener(ev, start, { once: false })
);

function start(){
  if (running) return;
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.resume().then(() => {
      running = true;

      // Osciladores da sirene (dois tons alternando)
      osc1 = ctx.createOscillator();
      osc2 = ctx.createOscillator();
      osc1.type = 'sawtooth';
      osc2.type = 'square';
      osc1.frequency.value = 700;
      osc2.frequency.value = 900;

      // Volume no máximo
      gain = ctx.createGain();
      gain.gain.value = 1.0;

      // LFO que varre a frequência (efeito de sirene)
      lfo = ctx.createOscillator();
      lfo.frequency.value = 3;
      lfoGain = ctx.createGain();
      lfoGain.gain.value = 250;
      lfo.connect(lfoGain);
      lfoGain.connect(osc1.frequency);
      lfoGain.connect(osc2.frequency);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(ctx.destination);

      osc1.start();
      osc2.start();
      lfo.start();

      // Vibração contínua (Android)
      if (navigator.vibrate) {
        setInterval(() => navigator.vibrate([500, 200]), 700);
      }

      // Mantém a tela ligada quando possível
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').catch(()=>{});
      }
    }).catch(()=>{});
  } catch(e){}
}

// Reforço para o áudio continuar mesmo se suspenso
setInterval(() => { if (ctx && ctx.state === 'suspended') ctx.resume(); }, 1000);
</script>
</body>
</html>
